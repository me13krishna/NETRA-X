# The operator's public-facing host. Deliberately unremarkable: a normal site
# with a normal config. Its only job is to serve the SAME favicon bytes, which
# is what a Shodan favicon-hash query would surface at the other end of the
# pivot from the hidden service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
}
