# mu_table.yaml — Base Priors and Feature Calibration Parameters for Bayesian Evidence Fusion

features:
  # EXACT_IDENTITY (Family Cap: 10.0)
  pgp_fingerprint_exact:
    family: EXACT_IDENTITY
    dependence_group: pgp_identity
    m_i: 0.9999
    u_i: 0.00000001
    description: Exact 160-bit SHA-1 PGP Key Fingerprint match
  
  ssh_host_key_fingerprint:
    family: EXACT_IDENTITY
    dependence_group: ssh_identity
    m_i: 0.999
    u_i: 0.0000001
    description: RSA/Ed25519 SSH host key fingerprint match

  # FINANCIAL (Family Cap: 7.5)
  btc_address_reuse:
    family: FINANCIAL
    dependence_group: wallet_cluster_btc
    m_i: 0.95
    u_i: 0.00001
    description: Direct Bitcoin address reuse across posts/profiles
  
  btc_co_input_clustering:
    family: FINANCIAL
    dependence_group: wallet_cluster_btc
    m_i: 0.90
    u_i: 0.0001
    description: Co-input transaction heuristics on UTXO graph

  # INFRASTRUCTURE (Family Cap: 5.0)
  favicon_mmh3_hash:
    family: INFRASTRUCTURE
    dependence_group: web_server_fingerprint
    m_i: 0.92
    u_i: 0.0001
    description: Exact MurmurHash3 digest of favicons
  
  ssl_tls_cert_serial:
    family: INFRASTRUCTURE
    dependence_group: web_server_fingerprint
    m_i: 0.88
    u_i: 0.0005
    description: Matching self-signed or custom TLS certificate serial

  # CONTENT_NLP (Family Cap: 5.0)
  simhash_clone_95:
    family: CONTENT_NLP
    dependence_group: site_content_nlp
    m_i: 0.85
    u_i: 0.001
    description: Near-duplicate page content similarity >= 95%
  
  unique_typo_signature:
    family: CONTENT_NLP
    dependence_group: site_content_nlp
    m_i: 0.75
    u_i: 0.005
