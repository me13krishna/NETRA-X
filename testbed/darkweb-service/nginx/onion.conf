# The deliberately leaky config.
#
# Every directive below is the OPPOSITE of what a competent operator would set.
# That is the point: each one maps to a check in workers/collection/onion_probe.py.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LEAK 3 -- server_tokens on: nginx announces its exact version. A real
    # hidden service would set this off, and most of the value of a banner
    # match comes from operators who forget.
    server_tokens on;

    # LEAK 4 -- discloses the application stack.
    add_header X-Powered-By "PHP/8.1.2-1ubuntu2.14" always;

    # LEAK 5 -- names an internal host that should never leave the network.
    add_header Via "1.1 vendor-edge-01.internal" always;

    # LEAK 2 -- the status page, served to anyone who asks. The probe matches
    # on the literal string "Apache Server Status" in the body, so the file
    # carries Apache's wording even though nginx is serving it -- operators
    # migrate servers and leave the old status handler reachable.
    location = /server-status {
        default_type text/html;
        alias /usr/share/nginx/html/server-status.html;
    }

    # LEAK 1 -- byte-identical to the clearnet twin's favicon. This is the pivot.
    location = /favicon.ico {
        add_header Cache-Control "no-store" always;
    }
}
