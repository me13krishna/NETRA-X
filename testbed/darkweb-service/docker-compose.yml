# Isolated testbed. Its own network, no dependency on the application stack, and
# nothing published beyond localhost -- this must never be reachable from
# anywhere but the machine it runs on.
services:
  # The leaky hidden service. Everything wrong with it is deliberate; see README.
  onion-site:
    image: nginx:1.27-alpine
    container_name: netra-testbed-onion
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/onion.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"   # localhost only, so `make verify` needs no Tor client
    networks: [testbed]
    restart: unless-stopped

  # The operator's public-facing host. Same favicon bytes, different hostname:
  # this is the other end of the favicon-hash pivot.
  clearnet-twin:
    image: nginx:1.27-alpine
    container_name: netra-testbed-clearnet
    volumes:
      - ./clearnet-twin:/usr/share/nginx/html:ro
      - ./nginx/clearnet.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8082:80"
    networks: [testbed]
    restart: unless-stopped

  tor:
    image: alpine:3.20
    container_name: netra-testbed-tor
    command: >
      sh -c "apk add --no-cache tor >/dev/null &&
             mkdir -p /var/lib/tor/hidden_service &&
             chown -R tor:tor /var/lib/tor &&
             chmod 700 /var/lib/tor/hidden_service &&
             exec su-exec tor tor -f /etc/tor/torrc"
    volumes:
      - ./torrc:/etc/tor/torrc:ro
      - tor_keys:/var/lib/tor/hidden_service
    networks: [testbed]
    depends_on: [onion-site]
    restart: unless-stopped

networks:
  testbed:
    driver: bridge

volumes:
  # The hidden-service key lives here rather than on disk in the repo, so the
  # onion address survives restarts but is never at risk of being committed.
  tor_keys:
