contradictions:
  temporal_impossible_overlap:
    is_contradiction: true
    contradiction_weight: 15.0
    description: Physically impossible simultaneous posts from opposing geolocations / timeframes
  
  pgp_key_conflict:
    is_contradiction: true
    contradiction_weight: 20.0
    description: Conflicting PGP key signatures explicitly published for same profile ID
