[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-x-krishna"
version = "0.1.0"
description = "Krishna's ML, Stylometry, Bayesian Attribution Engine, and Synthetic Benchmark module for NETRA-X"
readme = "README.md"
authors = [
    { name = "Krishna", email = "krishna@netra-x.local" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "bench*"]
