[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-x"
version = "0.1.0"
description = "NETRA-X: Evidence-Driven Dark Web Threat Actor Intelligence & Attribution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "neo4j>=5.18.0",
    "redis>=5.0.3",
    "minio>=7.2.5",
    "spacy>=3.7.4",
    "scikit-learn>=1.4.1.post1",
    "numpy>=1.26.4",
    "faststylometry>=0.0.6",
    "mmh3>=4.1.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
# Neural stylometry only. Deliberately NOT a runtime dependency: torch is a
# ~2GB install and the deployment target is a 512MB Render instance, where a
# hard requirement would break the build outright.
# Claude-backed copilot. Optional: the copilot answers deterministically from
# the ledger without it, which is the offline demo default.
copilot = [
    "anthropic>=0.40.0",
]
neural = [
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "flake8>=7.0.0",
]

# Explicit package list. Setuptools auto-discovery cannot handle a flat
# multi-package layout -- it finds apps/, packages/, workers/, bench/, seed/
# and refuses to guess, so `pip install -e .` (and therefore `make setup`,
# step 1 of the README) failed with "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["apps*", "packages*", "workers*", "seed*", "bench*"]
exclude = ["tests*", "docs*", "infra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
