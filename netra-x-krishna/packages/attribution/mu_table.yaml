  # STYLOMETRY (Family Cap: 3.0)
  stylometry_burrows_delta:
    family: STYLOMETRY
    dependence_group: author_stylometry
    m_i: 0.82
    u_i: 0.01
    description: Low Burrows' Delta distance across function words & n-grams

  # TEMPORAL (Family Cap: 2.0)
  temporal_diurnal_fit:
    family: TEMPORAL
    dependence_group: post_activity_temporal
    m_i: 0.70
    u_i: 0.10
